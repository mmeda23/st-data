name: Scrape catalogo

on:
  schedule:
    - cron: "17 23 * * *"   # todos los dias 20:17 hora Argentina
  workflow_dispatch:        # permite correrlo a mano

permissions:
  contents: write           # para poder guardar la base en el repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Correr scraper
        env:
          AUDIT_USER: ${{ secrets.AUDIT_USER }}
          AUDIT_PASS: ${{ secrets.AUDIT_PASS }}
        run: python au_sc.py

      - name: Armar catalogo
        run: python armar_catalogo.py

      - name: Publicar si hubo cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add catalogo.db.gz catalogo_version.json
          if git diff --cached --quiet; then
            echo "Nada para publicar"
          else
            git commit -m "Catalogo $(date +%F)"
            git push
          fi

      - name: Guardar CSVs para revisar
        uses: actions/upload-artifact@v4
        with:
          name: descarga_audit
          path: descarga_audit/
          retention-days: 7
